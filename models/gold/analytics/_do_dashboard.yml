version: 2

seeds:
  - name: seed_do_chapter_district
    description: >
      Temporary chapter -> district -> DO list from the DO dashboard sheet (62 active E2
      chapters), until district lands in a mapping source. DO names are first names.
    config:
      column_types:
        chapter_id: text
    columns:
      - name: chapter_id
        tests:
          - unique
          - not_null

  - name: seed_do_glossary
    description: >
      "What the words mean" table for the DO dashboard (spec §3.6c): one plain-words definition per
      term, in display order.
    columns:
      - name: term_order
        tests:
          - unique
          - not_null
      - name: term
        tests:
          - unique
          - not_null

models:
  - name: prod_do_chapter_summary
    description: >
      DO dashboard (E2) metric model, snake_case. One row per active E2 chapter for AY 2026-27:
      Metric 1 (volunteer requirement met at 1:5 and 2:5), Metric 2 (sessions started, all
      mentoring circles started), volunteers and child cover. See the model header for the rules.
    columns:
      - name: chapter_id
        tests:
          - unique
          - not_null
      - name: volunteer_requirement_met_1to5
        tests:
          - not_null
      - name: volunteer_requirement_met_2to5
        tests:
          - not_null
      - name: active_children
        tests:
          - not_null
      - name: sessions_commenced_met
        tests:
          - not_null
      - name: has_sessions_started
        tests:
          - not_null
      - name: volunteers_needed
        tests:
          - not_null
      - name: volunteers_in_chapter
        tests:
          - not_null
      - name: volunteers_allocated
        tests:
          - not_null
      - name: volunteers_not_allocated
        tests:
          - not_null
      - name: mentoring_circles_needing_volunteer
        tests:
          - not_null

  - name: prod_do_national_kpis
    description: >
      DO dashboard (E2) one-row national headline, snake_case. Every % is a ratio of sums across
      prod_do_chapter_summary.

  - name: prod_do_chapters_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per chapter, sourced from prod_do_chapter_summary.
    columns:
      - name: Chapter
        description: Chapter name.
        quote: true
        tests:
          - not_null
      - name: Why volunteer requirement not met
        quote: true
        description: First reason that applies when the 1:5 requirement isn't met; empty when met.

  - name: prod_do_national_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row of national tiles, sourced from prod_do_national_kpis.

  - name: prod_do_active_children
    description: >
      Shared base: every active child per chapter for AY 2026-27. Feeds child cover and the
      mentoring-circle rule. Not read by Dalgo.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - chapter_id
              - child_id

  - name: prod_do_mentoring_circles
    description: >
      Shared base: every mentoring circle with a slot (one per section-slot pair), with volunteers,
      slot-link start, first planned session and held flags. Feeds Metrics 1 and 2 and the weekly
      sessions view. Not read by Dalgo.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - slot_id
              - class_section_id

  - name: prod_do_volunteer_session_dates
    description: >
      Shared base: every planned volunteer session from 2026-10-01 with taken / held flags. Feeds
      Metric 3. Not read by Dalgo.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - volunteer_id
              - slot_class_section_id
              - session_date

  - name: prod_do_volunteer_consistency
    description: >
      DO dashboard (E2) Metric 3, snake_case. One row per chapter per period (Since 1 October,
      each month from October 2026, Last 28 days).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - chapter_id
              - period_type
              - period_start

  - name: prod_do_national_consistency
    description: National Metric 3 per period, ratio of sums, snake_case.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - period_type
              - period_start

  - name: prod_do_weekly_sessions
    description: >
      DO dashboard (E2) weekly sessions, ideal / planned / held per mentoring circle, snake_case.
      One row per chapter per week (Monday start) from the week of 28 Sep, counting from 2026-10-01.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - chapter_id
              - week_start

  - name: prod_do_consistency_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per chapter per period.

  - name: prod_do_national_consistency_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per period.

  - name: prod_do_weekly_sessions_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per chapter per week.

  - name: prod_do_national_weekly_sessions_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per week, national.

  - name: prod_do_district_summary
    description: >
      DO dashboard (E2) district rollup, snake_case. One row per district plus an "All districts"
      row (spec §3.6b). Every % is a ratio of sums across prod_do_chapter_summary.
    columns:
      - name: district
        tests:
          - unique
          - not_null

  - name: prod_do_district_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per district plus "All districts".

  - name: prod_do_data_freshness_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row: when attendance (DOTS) and volunteers / children (Bubble)
      last synced.

  - name: prod_do_goals_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. The 31 Oct goals table: one row per district x goal, plus All
      districts (40 rows).

  - name: prod_do_glossary_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per glossary term.

  - name: prod_do_circle_sessions
    description: >
      DO dashboard (E2) base: every planned circle-date from 1 October 2026, cancelled kept in, each in one of five groups (spec §3.7 R2). Not read by Dalgo.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - slot_id
              - class_section_id
              - session_date

  - name: prod_do_session_breakdown
    description: >
      DO dashboard (E2) planned sessions in five groups, one row per chapter per week (spec §3.7 R2).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - chapter_id
              - week_start

  - name: prod_do_cancellation_reasons
    description: >
      DO dashboard (E2) cancelled sessions by reason, one row per chapter per reason (spec §3.7 R3).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - chapter_id
              - cancel_reason

  - name: prod_do_volunteer_sessions
    description: >
      DO dashboard (E2) volunteer table, one row per volunteer per chapter per period (spec §3.7 R4).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - chapter_id
              - volunteer_id
              - period_type
              - period_start

  - name: prod_do_child_sessions
    description: >
      DO dashboard (E2) child table, one row per child per chapter per period; first name and child ID only (spec §3.7 R4, R8).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - chapter_id
              - child_id
              - period_type
              - period_start

  - name: prod_do_session_breakdown_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per chapter per week.

  - name: prod_do_cancellation_reasons_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per chapter per cancellation reason.

  - name: prod_do_volunteer_sessions_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per volunteer per chapter per period.

  - name: prod_do_child_sessions_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per child per chapter per period.
