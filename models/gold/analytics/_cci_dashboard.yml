version: 2

seeds:
  - name: seed_cci_baseline_chapter_name
    description: >
      E1 baseline sheet chapter spelling -> CCI school_id (E1 spec §7 B2). One row per spelling seen
      in the sheet's Chapter Name (or, for "Chapter not listed above", its free-text chapter answer),
      matched exactly after trimming, so each variant ("St. Patricks" / "ST. Patricks") has its own
      row. Also carries the Dashboard tab's names for CCIs with no responses yet. A blank school_id
      marks a School or Community chapter on the sheet: known, out of scope. Spellings in neither
      group are reported by assert_cci_baseline_chapter_names_mapped (warn), never guessed.
    config:
      column_types:
        sheet_chapter_name: text
        school_id: text
    columns:
      - name: sheet_chapter_name
        tests:
          - unique
          - not_null
      - name: school_id
        tests:
          - relationships:
              arguments:
                to: ref('seed_cci_chapter_group')
                field: school_id

  - name: seed_cci_chapter_group
    description: >
      CCI -> city -> district -> DO list for the CCI dashboard (E1), one row per Platform Commons school
      with a 2026-27 section (28, Test School excluded). City from dim_pc_school, with the 5 missing
      filled by name. District (8-11) and DO from the DO sheet's Chapter mapping tab (spec §7 D1).
    config:
      column_types:
        school_id: text
        chapter_name: text
        city: text
        district: text
        do_name: text
    columns:
      - name: school_id
        tests:
          - unique
          - not_null
      - name: district
        tests:
          - not_null
      - name: do_name
        tests:
          - not_null

models:
  - name: prod_cci_active_children
    description: >
      CCI dashboard (E1) base: one row per active child per 2026-27 section, with the section's
      programme. Not read by Dalgo.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - student_id
              - sc_level_batch_id

  - name: prod_cci_session_dates
    description: >
      CCI dashboard (E1) base: dates each slot shift held a session since 1 June 2026. Not read by Dalgo.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - worknode_slot_shift_id
              - session_date

  - name: prod_cci_mentoring_circles
    description: >
      CCI dashboard (E1) base: one row per mentoring circle (active slot shift on a 2026-27 section
      with active children). Not read by Dalgo.
    columns:
      - name: worknode_slot_shift_id
        tests:
          - unique
          - not_null
      - name: volunteers
        tests:
          - not_null

  - name: prod_cci_chapter_summary
    description: >
      CCI dashboard (E1) metric model, snake_case. One row per CCI for AY 2026-27 (28, including one
      with no children): volunteer requirement met, children with a volunteer, volunteers needed and
      placed, circles started, sessions held since 1 October. See the model header for the rules.
    columns:
      - name: chapter_id
        tests:
          - unique
          - not_null
      - name: active_children
        tests:
          - not_null
      - name: volunteer_requirement_met_1to5
        tests:
          - not_null
      - name: volunteer_requirement_met_2to5
        tests:
          - not_null
      - name: has_sessions_started
        tests:
          - not_null
      - name: all_circles_started
        tests:
          - not_null

  - name: prod_cci_district_summary
    description: >
      CCI dashboard (E1) district rollup, snake_case. One row per district plus an "All districts" row
      (DO blank). Every % is a ratio of sums across prod_cci_chapter_summary.
    columns:
      - name: district
        tests:
          - unique
          - not_null

  - name: prod_cci_weekly_sessions
    description: >
      CCI dashboard (E1) weekly sessions held, one row per CCI per week (Monday start) from the week
      of 28 Sep, counting from 2026-10-01.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - chapter_id
              - week_start

  - name: prod_cci_chapters_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per CCI.

  - name: prod_cci_district_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per district plus "All districts".

  - name: prod_cci_weekly_sessions_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per CCI per week.

  - name: prod_cci_data_freshness_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row: when Platform Commons last synced, and the share of mentoring
      circles with a weekly slot linked.

  - name: prod_cci_last_updated_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. The "Last updated" table at the top of every tab: one row per
      source (Platform Commons), date as text. The freshness model stays until Dalgo swaps to this table.
    columns:
      - name: Source
        quote: true
        tests:
          - unique
          - not_null
      - name: Last updated
        quote: true
        tests:
          - not_null

  - name: prod_cci_goals_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. The 31 Oct goals table: one row per district x goal plus "All districts" x goal
      (20 rows), from prod_cci_district_summary.

  - name: prod_cci_circle_sessions
    description: >
      CCI dashboard (E1) base: every session held by a mentoring circle since 1 June 2026, with who held it and its hours (spec §3.10). Not read by Dalgo.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - worknode_slot_shift_id
              - session_date

  - name: prod_cci_cancellations
    description: >
      CCI dashboard (E1) sessions cancelled from 1 October 2026, one row per circle per date (spec §3.10). Empty until Platform Commons logs a 2026-27 cancellation.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - worknode_slot_shift_id
              - session_date

  - name: prod_cci_session_breakdown
    description: >
      CCI dashboard (E1) sessions held by the original volunteer vs a substitute, and cancelled, one row per CCI per week (spec §3.10).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - chapter_id
              - week_start

  - name: prod_cci_cancellation_reasons
    description: >
      CCI dashboard (E1) cancelled sessions by reason, one row per CCI per reason; coded reasons read Reason code N (spec §3.10).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - chapter_id
              - cancel_reason

  - name: prod_cci_volunteer_sessions
    description: >
      CCI dashboard (E1) volunteer table, one row per volunteer per CCI per period, with planned
      (slot-day based, less cancellations and holidays), taken, % of planned taken and status
      (spec §3.10, §8 2026-11-12 (later) ruling 2).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - chapter_id
              - volunteer_user_id
              - period_type
              - period_start
      - dbt_utils.expression_is_true:
          arguments:
            expression: "sessions_planned > 0 or sessions_taken > 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "planned_taken <= sessions_planned and planned_taken <= sessions_taken"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(sessions_planned = 0) = (attendance_pct is null and status is null)"

  - name: prod_cci_child_sessions
    description: >
      CCI dashboard (E1) child table, one row per child per CCI per period; first name and child ID only (spec §3.10).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - chapter_id
              - child_id
              - period_type
              - period_start

  - name: prod_cci_session_breakdown_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per CCI per week.

  - name: prod_cci_cancellation_reasons_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per CCI per cancellation reason.

  - name: prod_cci_volunteer_sessions_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per volunteer per CCI per period. Same columns as
      prod_do_volunteer_sessions_display, less "Chapter organiser".
    columns:
      - name: Status
        quote: true
        tests:
          - accepted_values:
              arguments:
                values: ['Healthy', 'At risk', 'Unhealthy']
      - name: '% of planned sessions taken'
        quote: true
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
              config:
                where: '"% of planned sessions taken" is not null'

  - name: prod_cci_child_sessions_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One row per child per CCI per period.

  - name: prod_cci_planned_sessions
    description: >
      CCI dashboard (E1) base, layout v4 (spec §7 L1): every planned circle-date from 1 Oct 2026 (a
      circle with a weekly slot day from Platform Commons' class ops data), cancelled ones kept in,
      each in one group. Base for the weekly, breakdown and cancellation models. Not read by Dalgo.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - worknode_slot_shift_id
              - session_date
    columns:
      - name: session_group
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['cancelled', 'held_by_original', 'held_by_substitute', 'volunteer_absent', 'no_volunteer_assigned']

  - name: prod_cci_link_applicants
    description: >
      CCI dashboard (E1), layout v4 (spec §7 L4): this year's applicants who applied through a CCI's
      sourcing campaign link (chapter mapping sheet, engine E1). Not read by Dalgo.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - volunteer_id
              - chapter_id

  - name: prod_cci_session_groups_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. Long form of prod_cci_session_breakdown for the Sessions pies (spec E1
      §7 L5): one row per CCI x week x "What happened" x "Held by", zero rows dropped. The three sum
      tests against the breakdown are singular tests: tests/assert_cci_session_groups_sum_*.sql.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - '"CCI"'
              - '"City"'
              - '"Week starting"'
              - '"What happened"'
              - '"Held by"'
    columns:
      - name: What happened
        quote: true
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Held', 'Cancelled', 'Volunteer absent', 'No volunteer assigned']
      - name: Sessions
        quote: true
        tests:
          - not_null

  - name: prod_cci_national_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. One-row national tiles for the CCI dashboard (spec E1 §7 L4, L7): the
      All districts row plus city and open-pool leads, which aren't per CCI.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: '"CCIs" > 0'

  - name: prod_cci_baseline_chapters
    description: >
      CCI dashboard (E1) Metric 4, baseline (spec §3.7, §7 B1-B5), snake_case. One row per CCI
      (28): active children, children with a baseline (distinct name + grade on the E1 baseline
      sheet), % of active children, children who cleared ASER, forms submitted. Not read by Dalgo.
    columns:
      - name: chapter_id
        tests:
          - unique
          - not_null
      - name: children_with_baseline
        tests:
          - not_null
      - name: children_cleared_aser
        tests:
          - not_null

  - name: prod_cci_baseline_display
    description: >
      Dalgo-facing presentation model. Column names are display names by design. Nothing in dbt
      should ref() this model. The CCI Baseline tab's table: one row per CCI, sourced from
      prod_cci_baseline_chapters. Counts children, not forms (except "Baseline forms submitted").
    columns:
      - name: CCI
        quote: true
        tests:
          - not_null
          - unique
