version: 2

models:
  - name: int_google_sheet__chapter_mapping
    description: >
      Chapter/CO/CHO/Fundraiser/Campaign mapping, hand-maintained in the master mapping
      Google Sheet.
    columns:
      - name: city_name
        tests:
          - accepted_values:
              # Severity downgraded to warn 2026-09-03 -- the test is correct and the data is
              # wrong (one sheet row still has city_name = 'January', unfixed since 2026-08-26),
              # but at error severity this one bad cell was blocking dbt build from reaching this
              # model's ~25 downstream nodes (fct_volunteer_pipeline, prod_sric_dashboard_data,
              # prod_sric_funnel, prod_chapter_campaign_daily, and their tests) on every run that
              # didn't manually --exclude it -- including the scheduled refresh, which broke SRIC
              # dashboard charts daily as a result. Warn keeps the failure visible (it still shows
              # up in run output and Elementary) without blocking the build.
              # REVERT TO error ONCE THE SHEET ROW IS CORRECTED AT SOURCE. Do not extend this
              # downgrade to any other test.
              config:
                severity: warn
              arguments:
                # D4: catches hand-entry errors on the sheet (e.g. "January" landing in
                # city_name, 2026-08-26). This is the current list of cities MAD operates
                # chapters in -- extend it when a new city launches, don't drop the test.
                values:
                  - Delhi
                  - Chennai
                  - Mumbai
                  - Bangalore
                  - Hyderabad
                  - Nagpur
                  - Gwalior
                  - Cochin
                  - Guntur
                  - Coimbatore
                  - Lucknow
                  - Ahmedabad
                  - Pune
                  - Trivandrum
                  - Mysore
                  - North Goa
                  - Vijayawada
                  - Kolkata
                  - Dehradun
