version: 2

models:
  - name: fct_volunteer_pipeline
    description: >
      One row per volunteer for the current reporting academic year. Carries two independent
      populations -- INTAKE (this year's applicant cohort, PC-side, opportunity-filtered) and
      COVERAGE (current-state census, Bubble-side, no opportunity filter) -- per
      SRI_DASHBOARD_SPEC.md §12c. Never convert between them.
    columns:
      - name: volunteer_id
        tests:
          - not_null
      - name: chapter
        description: >
          Chapter name, looked up from int_google_sheet__chapter_mapping by chapter_id (2026-09-03,
          matching prod_sric_dashboard_data/prod_sric_funnel column naming so Dalgo's native Chapter
          filter can reach charts built on this fact). NULL where chapter_id is NULL (unattributed
          intake leads) -- see chapter_id's own NULL semantics.
      - name: city
        description: >
          Renamed from city_name 2026-09-03 to match prod_sric_dashboard_data/prod_sric_funnel, so
          Dalgo's native City filter (which matches by column name) can reach charts on this fact.
      - name: is_compliant
        tests:
          - not_null
      - name: is_onboarded
        tests:
          - not_null
      - name: is_multi_chapter
        description: >
          True if the source had more than one chapter for this volunteer before dedup picked
          one (most recent created_date, then highest chapter_id). See the model's grain comment.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - volunteer_id
              - academic_year
